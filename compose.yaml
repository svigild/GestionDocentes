# ============================================================
# Docker Compose - GestionDocentes
# Levanta la aplicación completa: Backend + Base de Datos
# Uso: docker compose up -d
# ============================================================

services:
  # ---- Base de datos MySQL ----
  mysql:
    image: mysql:8.0
    container_name: gestiondocentes-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gestion_docentes}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppass}
    ports:
      - "3307:3306"  # Puerto 3307 en host para no colisionar con MySQL local
    volumes:
      - mysql_data:/var/lib/mysql  # Volumen nombrado para persistencia de datos
    networks:
      - gestiondocentes-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- Aplicación Spring Boot ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: serxu/gestion-docentes:latest
    container_name: gestiondocentes-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/gestion_docentes?allowPublicKeyRetrieval=TRUE&useSSL=FALSE&serverTimezone=Europe/Madrid
      DB_USERNAME: ${MYSQL_USER:-appuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-apppass}
      SHOW_SQL: "false"
      PORT: 8080
    volumes:
      - uploads_data:/app/uploads  # Persistencia de archivos subidos
    depends_on:
      mysql:
        condition: service_healthy  # Espera a que MySQL esté listo
    networks:
      - gestiondocentes-net

# ---- Volúmenes nombrados (persistencia) ----
volumes:
  mysql_data:
    name: gestiondocentes-mysql-data
  uploads_data:
    name: gestiondocentes-uploads

# ---- Red interna ----
networks:
  gestiondocentes-net:
    name: gestiondocentes-network
