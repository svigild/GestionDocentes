<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::section})}">
<head></head>
<body>
<section>

    <style>
        .horario-table th, .horario-table td {
            text-align: center;
            vertical-align: middle;
            padding: 0.7rem 0.5rem;
        }
        .hora-label {
            font-weight: 700;
            color: #4f46e5;
            font-size: 0.85rem;
        }
        .celda-clase {
            background: linear-gradient(135deg, #eef2ff, #e0e7ff);
            border-radius: 8px;
            border: 1px solid #c7d2fe;
        }
        .celda-clase .asig {
            font-weight: 700;
            color: #4338ca;
            font-size: 0.9rem;
        }
        .celda-clase .aula {
            font-size: 0.72rem;
            color: #6366f1;
        }
        .celda-libre {
            color: #94a3b8;
            font-size: 0.8rem;
        }
    </style>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold m-0"><i class="bi bi-calendar-week me-2"></i>Mi Horario Semanal</h4>
            <p class="text-muted small m-0">Vista de tu horario lectivo semanal completo.</p>
        </div>
        <div class="user-profile">
            <div class="avatar" th:text="${docente.siglas != null ? docente.siglas : '??'}" style="font-size: 0.8rem;">??</div>
            <div class="d-flex flex-column lh-1 me-2">
                <span class="fw-bold small" th:text="${docente.nombre + ' ' + docente.apellidos}">Nombre</span>
                <span class="text-muted" style="font-size: 0.75rem;" th:text="${docente.departamento != null ? docente.departamento.nombre : '—'}">Depto</span>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm overflow-hidden">
        <div class="table-responsive">
            <table class="table horario-table mb-0">
                <thead>
                <tr class="bg-primary text-white">
                    <th style="width: 80px;">Hora</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="fila, iter : ${matrizHorario}">
                    <td class="bg-light">
                        <span class="hora-label" th:text="${iter.index + 1} + 'ª'">1ª</span>
                    </td>
                    <td th:each="col : ${#numbers.sequence(0,4)}">
                        <div th:if="${matrizHorario[iter.index][col] != null}" class="celda-clase p-2">
                            <div class="asig" th:text="${matrizHorario[iter.index][col]}">PRG</div>
                            <div class="aula" th:text="${matrizAula[iter.index][col] != null ? matrizAula[iter.index][col] : ''}">A01</div>
                        </div>
                        <div th:unless="${matrizHorario[iter.index][col] != null}" class="celda-libre">
                            <i class="bi bi-dash"></i>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- LEYENDA -->
    <div class="mt-3 d-flex gap-4 small text-muted">
        <div><span class="d-inline-block rounded me-1" style="width: 12px; height: 12px; background: #e0e7ff; border: 1px solid #c7d2fe;"></span> Clase asignada</div>
        <div><i class="bi bi-dash me-1"></i> Hora libre</div>
    </div>

</section>
</body>
</html>
