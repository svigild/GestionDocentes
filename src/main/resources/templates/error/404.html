<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página no encontrada</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { background: white; border-radius: 16px; padding: 3rem; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.08); max-width: 480px; }
        .error-code { font-size: 5rem; font-weight: 800; color: #4f46e5; line-height: 1; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h4 class="fw-bold mt-3 mb-2">Página no encontrada</h4>
        <p class="text-muted mb-4">La página que buscas no existe o ha sido trasladada a otra ubicación.</p>
        <a href="/" class="btn btn-primary px-4 py-2">
            <i class="bi bi-house-door me-2"></i> Volver al Dashboard
        </a>
    </div>
</body>
</html>
