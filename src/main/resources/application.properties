# Nombre de la aplicacion
spring.application.name=GestionDocentes

# --- DATOS DE CONEXION (MySQL) ---
# Las variables de entorno permiten sobreescribir estos valores en Docker/producción
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_docentes?allowPublicKeyRetrieval=TRUE&useSSL=FALSE&serverTimezone=Europe/Madrid}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- CONFIGURACION JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# --- CONFIGURACION DE CORREO (SMTP) ---
# En desarrollo se puede usar Mailtrap (puerto 2525) o un servidor local.
# En produccion se configuran las variables de entorno con un proveedor SMTP real (Brevo, SendGrid, etc.).
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Direccion remitente y URL publica de la aplicacion (para los enlaces de los emails)
app.mail.from=${MAIL_FROM:no-reply@gestiondocentes.com}
app.mail.from-name=${MAIL_FROM_NAME:GestionDocentes}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# NUMERO MAXIMO DE PERMISOS DIARIOS
app.config.max-permisos-diarios=${MAX_PERMISOS_DIARIOS:3}

# SUBIDA DE ARCHIVOS
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Puerto del servidor (configurable para hosting)
server.port=${PORT:8080}