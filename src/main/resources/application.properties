# Nombre de la aplicacion
spring.application.name=GestionDocentes

# --- DATOS DE CONEXION (MySQL) ---
# Las variables de entorno permiten sobreescribir estos valores en Docker/producción
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_docentes?allowPublicKeyRetrieval=TRUE&useSSL=FALSE&serverTimezone=Europe/Madrid}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- CONFIGURACION JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de correo (opcional)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:sergio3vd@gmail.com}
spring.mail.password=${MAIL_PASSWORD:admin}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_TLS:false}

# NUMERO MAXIMO DE PERMISOS DIARIOS
app.config.max-permisos-diarios=${MAX_PERMISOS_DIARIOS:3}

# SUBIDA DE ARCHIVOS
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Puerto del servidor (configurable para hosting)
server.port=${PORT:8080}